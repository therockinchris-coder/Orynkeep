services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: orynkeep
      POSTGRES_DB: orynkeep
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      # Check TCP: the temporary initialization server only accepts socket connections.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U orynkeep -d orynkeep"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://orynkeep:${POSTGRES_PASSWORD}@db:5432/orynkeep?sslmode=disable
      STORAGE_PATH: /data
      SETUP_TOKEN: ${SETUP_TOKEN:-}
    volumes:
      - storage:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  web:
    build: ./frontend
    ports:
      - "${ORYNKEEP_BIND_ADDRESS:-127.0.0.1}:${ORYNKEEP_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  database:
  storage:
